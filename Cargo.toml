[package]
name = "rmk-corne"
version = "0.0.1"
authors = ["LegitCamper <sawyerbristol@gmail.com>"]
description = "Keyboard firmware written in Rust"
edition = "2024"

[features]
default = ["reset", "prospector"]
central = ["rmk/host"]
peripheral_left = []
peripheral_right = []
reset = []
usb_logging = ["rmk/usb_log"]
prospector = [
  "embedded-graphics",
  "lcd-async",
  "kolibri-embedded-gui",
  "heapless",
  "embedded-hal",
  "embedded-hal-async",
  "embassy-embedded-hal",
]

[[bin]]
name = "central"
path = "src/central.rs"
required-features = ["central"]

[[bin]]
name = "peripheral_left"
path = "src/peripherals.rs"
required-features = ["peripheral_left"]

[[bin]]
name = "peripheral_right"
path = "src/peripherals.rs"
required-features = ["peripheral_right"]

[dependencies]
rmk = { git = "https://github.com/HaoboGu/rmk/", rev = "62957531dbd74fd1e904858b2f885a9b7523b5e3", features = [
  "nrf52840_ble",
  "split",
  "storage",
  "async_matrix",
  "adafruit_bl",
  "vial",
], default-features = false }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
  "defmt",
  "peripheral",
  "central",
  "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
  "defmt",
  "critical-section-impl",
  "nrf52840",
] }
bt-hci = { version = "0.6", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = [
  "tick-hz-32_768",
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.8", features = [
  "defmt",
  "nrf52840",
  "time-driver-rtc1",
  "gpiote",
  "unstable-pac",
  "nfc-pins-as-gpio",
  "time",
] }
embassy-executor = { version = "0.9", features = [
  "defmt",
  "arch-cortex-m",
  "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.6.0", features = ["defmt"] }

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

embedded-hal-async = { version = "1.0.0", optional = true }
embedded-hal = { version = "1.0", optional = true }
embassy-embedded-hal = { version = "0.3.0", optional = true }

# prospector
lcd-async = { git = "https://github.com/okhsunrog/lcd-async", rev = "ab6b71d677cae88a3f49d29988c4cc91d3db3ff8", optional = true }
embedded-graphics = { version = "0.8.1", optional = true }
kolibri-embedded-gui = { version = "0.1.0", optional = true }
heapless = { version = "0.9.3", optional = true }

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"
overflow-checks = false
lto = "fat"
