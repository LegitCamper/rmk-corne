[package]
name = "rmk-corne"
version = "0.0.1"
authors = ["LegitCamper <sawyerbristol@gmail.com>"]
description = "Keyboard firmware written in Rust"
edition = "2024"

[features]
default = ["central", "ble"]
central = ["rmk/host"]
peripheral_left = []
peripheral_right = []
reset = []
usb_logging = ["rmk/usb_log"]
# BLE between halves and a BLE dongle acting as USB host (the default setup).
ble = ["rmk/nrf52840_ble", "rmk/adafruit_bl", "dep:nrf-sdc", "dep:nrf-mpsl", "dep:bt-hci"]
# Fully wired: halves are linked by a wired serial connection instead of BLE,
# and the central half plugs directly into USB instead of a BLE dongle.
wired = []

[[bin]]
name = "central"
path = "src/central.rs"
required-features = ["central", "ble"]

[[bin]]
name = "peripheral_left"
path = "src/peripherals.rs"
required-features = ["peripheral_left"]

[[bin]]
name = "peripheral_right"
path = "src/peripherals.rs"
required-features = ["peripheral_right"]

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

[dependencies]
rmk = { git = "https://github.com/HaoboGu/rmk/", rev = "62957531dbd74fd1e904858b2f885a9b7523b5e3", features = [
  "split",
  "storage",
  "async_matrix",
  "vial",
  "vial_lock",
], default-features = false }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", optional = true, features = [
  "defmt",
  "peripheral",
  "central",
  "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", optional = true, features = [
  "defmt",
  "critical-section-impl",
  "nrf52840",
] }
bt-hci = { version = "0.6", optional = true, features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = [
  "tick-hz-32_768",
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.8", features = [
  "defmt",
  "nrf52840",
  "time-driver-rtc1",
  "gpiote",
  "unstable-pac",
  "nfc-pins-as-gpio",
  "time",
] }
embassy-executor = { version = "0.9", features = [
  "defmt",
  "arch-cortex-m",
  "executor-thread",
] }
embassy-usb = "0.5.1"
embassy-embedded-hal = "0.5"
embedded-io-async = "0.6"
usbd-hid = "0.10.0"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
